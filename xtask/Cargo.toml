[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Build-time tooling for modeltap (release-prep, validate-tag, render-formula, extract-changelog, lint-workflows)."

# Dependencies added incrementally per DELIVER step as each subcommand's GREEN
# implementation lands. Step 01-01 added `toml_edit` + `semver` for the
# parse_workspace_version / assert_monotonic pure functions, and `proptest`
# (dev-only) for the monotonic-bump invariant property test.

[dependencies]
toml_edit = "0.22"
semver = "1"
# CLI parsing for the xtask subcommands. Added in DELIVER step 01-02 when the
# first subcommand (`validate-tag`) graduated from the raw env::args dispatcher
# in the DISTILL scaffold to a typed clap-derive parser.
clap = { workspace = true }
# Tera template engine + serde for FormulaCtx serialization. Added in DELIVER
# step 01-04 (render-formula) per ADR-014 (Tera-in-xtask vs inline shell).
tera = { version = "1.20", default-features = false }
serde = { workspace = true }

[dev-dependencies]
proptest = "1.4"
