[package]
name = "modeltap-plugin-gpt4all"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GPT4All plugin for modeltap. Reads <data>/.gpt4all model files; per-platform default search paths."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
modeltap-core = { path = "../../crates/modeltap-core" }

# ADR-001: object-safe async trait for `Tool`.
async-trait = "0.1"

# ADR-005: tokio runtime; later steps will use spawn_blocking for the directory walk.
tokio = { workspace = true }

# Errors (per ADR-007).
thiserror = { workspace = true }

# Filesystem walk (recursive).
walkdir = "2"

# Plugin registration (per ADR-001).
inventory = "0.3"

# Diagnostic logging.
tracing = { workspace = true }

# Config parsing — TOML for [plugins.gpt4all] search_paths.
serde = { workspace = true }
toml = "0.8"

# Per-OS path defaults.
dirs = "5"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
