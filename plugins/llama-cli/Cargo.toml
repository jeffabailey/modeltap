[package]
name = "modeltap-plugin-llama-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "llama-cli plugin for modeltap (per ADR-001). Discovers loose .gguf files."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
modeltap-core = { path = "../../crates/modeltap-core" }

# ADR-001: object-safe async trait for `Tool`.
async-trait = "0.1"

# ADR-005: tokio runtime; plugin uses spawn_blocking for the directory walk.
tokio = { workspace = true }

# Errors (per ADR-007).
thiserror = { workspace = true }

# Filesystem walk (recursive).
walkdir = "2"

# Plugin registration (per ADR-001).
inventory = "0.3"

# Diagnostic logging.
tracing = { workspace = true }

# Config TOML parsing for [plugins.llama-cli] search_paths.
serde = { workspace = true }
toml = "0.8"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
