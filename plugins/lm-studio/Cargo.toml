[package]
name = "modeltap-plugin-lm-studio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "LM Studio plugin for modeltap (per ADR-001). Walks the new and older default cache paths."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
modeltap-core = { path = "../../crates/modeltap-core" }

# ADR-001: object-safe async trait for `Tool`.
async-trait = "0.1"

# ADR-005: tokio runtime; plugin uses spawn_blocking for the directory walk.
tokio = { workspace = true }

# Errors (per ADR-007).
thiserror = { workspace = true }

# Filesystem walk (recursive).
walkdir = "2"

# Plugin registration (per ADR-001).
inventory = "0.3"

# Diagnostic logging.
tracing = { workspace = true }

# Config TOML parsing for [plugins.lm-studio] search_paths (mirror llama-cli).
serde = { workspace = true }
toml = "0.8"

# JSON parsing for the model.json sidecar fallback in inspect_model
# (older LM Studio layouts ship a model.json next to the GGUF binary).
serde_json = { workspace = true }

[dev-dependencies]
# Re-declare modeltap-core with `test-helpers` enabled so integration tests
# under `tests/` can import `modeltap_core::tests::plugin_contract::*`
# (the parametrized harness for `Tool::delete_folder`). Cargo unifies this
# with the `[dependencies]` entry; the feature is dev-only. Per
# `docs/feature/folder-group-bulk-delete/distill/plugin-contract-spec.md` §2.
modeltap-core = { path = "../../crates/modeltap-core", features = ["test-helpers"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
