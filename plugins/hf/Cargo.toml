[package]
name = "modeltap-plugin-hf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Hugging Face cache plugin for modeltap (per ADR-001). Walks ~/.cache/huggingface/hub/ snapshot symlinks."

[lints.rust]
unsafe_code = "forbid"

[features]
# Step 04-01: compiles the `MODELTAP_TEST_EBUSY_PATHS` env-var seam into the
# per-file unlink loop so the M4 acceptance test in `modeltap-app` can drive a
# real EBUSY-equivalent partial failure end-to-end. Production binaries do NOT
# enable this feature (verified by the absence of the env-var name in stripped
# release builds, per ADR-010 §D4). `cfg(test)` already enables the seam for
# in-crate tests; `cfg(feature = "test-harness")` extends that to downstream
# crates' tests by way of `dev-dependencies` propagation.
test-harness = []

[dependencies]
modeltap-core = { path = "../../crates/modeltap-core" }

# ADR-001: object-safe async trait for `Tool`.
async-trait = "0.1"

# ADR-005: tokio runtime; plugin uses spawn_blocking for the directory walk.
tokio = { workspace = true }

# Errors (per ADR-007).
thiserror = { workspace = true }

# Filesystem walk (recursive).
walkdir = "2"

# Plugin registration (per ADR-001).
inventory = "0.3"

# Diagnostic logging.
tracing = { workspace = true }

# Serde for the search-path entries the inspect override emits (also reused by
# the TOML config loader below).
serde = { workspace = true }

# JSON parsing for `inspect_model` (Step 03-02 part 2/N): the HF override
# reads `<hub>/models--<org>--<repo>/snapshots/<rev>/config.json` and
# projects a tool-relevant KV subset into `ModelDetail.metadata_kv`. Matches
# the Ollama plugin's manifest-reader pattern (workspace pin `serde_json = "1"`).
serde_json = { workspace = true }

# Config TOML parsing (US-21 step 02-02 user-config search paths). Mirrors the
# `atomic-chat` / `lm-studio` plugins' pattern: `[plugins.hf] search_paths`
# in `~/.modeltap/config.toml` augments the default search paths.
toml = "0.8"

[dev-dependencies]
# Re-declare modeltap-core with `test-helpers` enabled so the integration test
# `tests/inspect_tool_contract.rs` (US-21 step 02-03) can import
# `modeltap_core::tests::inspect::*` (the parametrized §3.12 harness). Cargo
# unifies this with the `[dependencies]` entry; the feature is dev-only. Per
# `docs/feature/tool-model-info-sqlite-cache/distill/plugin-contract-spec.md` §2.
modeltap-core = { path = "../../crates/modeltap-core", features = ["test-helpers"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
