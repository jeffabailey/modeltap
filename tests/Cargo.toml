[[test]]
name = "release_process_workflow_structure"
path = "acceptance/release_process/workflow_structure.rs"

# DELIVER step 01-08 — Walking Skeleton TAP-BUMP activity (US-06,
# bump-tap-formula). Five scenarios covering the cross-repo seam against an
