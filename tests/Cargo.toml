# DELIVER step 03-05 — Recovery scenarios (`@recovery` tag in
# integration-checkpoints.feature). Two scenarios against ephemeral
# modeltap-fake (working) + tap-fake (bare) repos:
#   R-1. GH Release stays intact when bump-tap-formula fails (modelled as an
#        unreachable tap remote URL); the maintainer's retry reaches the same
#        end state with no duplicate bump branch (US-12 idempotency).
#   R-2. Maintainer yanks v0.2.0 by reverting the tap-bump merge commit; tap
#        main resolves to v0.1.0's Formula so `brew install` installs the
#        prior version. The prior release's artifact snapshot remains intact.
[[test]]
name = "release_process_recovery"
path = "acceptance/release_process/recovery.rs"

# DELIVER step 02-03 — SLSA L3 build-provenance attestation (US-09, ADR-013).
# Five invariants on `.github/workflows/release.yml`:
#   S-1. build job declares job-level `permissions:` with `id-token: write`,
#        `attestations: write`, and `contents: read` (least privilege).
#   S-2. build job invokes `actions/attest-build-provenance` pinned to `@v2`
#        (major-version tag — single-maintainer OSS trade-off per US-09).
#   S-3. attest step `with.subject-path` references the per-cell archive
#        `modeltap-*.tar.gz` so each matrix cell attests its own archive.
#   S-4. Step ordering: package step  <  attest step  <  upload-artifact step.
#   S-5. @requires_external smoke (#[ignore]d): `gh attestation verify` succeeds
#        against a published archive and identifies the modeltap workflow as
#        builder (K-PROV KPI hook).
[[test]]
name = "release_process_slsa_attestation"
path = "acceptance/release_process/slsa_attestation.rs"
