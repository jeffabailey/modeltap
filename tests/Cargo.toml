# Acceptance-test crate for the release-process feature.
#
# Wave: DELIVER (6 of 6) — added in step 01-02 (validate-tag).
#
# This crate hosts black-box acceptance tests that drive the `xtask` binary
# via `cargo run --package xtask -- ...` against fixture Cargo.toml files
# in tempdirs. It is excluded from default-members so plain `cargo test`
# from a workspace crate does not transitively run these tests, but
# `cargo test --workspace` DOES include them (per acceptance-test convention
# specified in the roadmap).
#
# Layout note: the conventional `<crate>/tests/*.rs` integration-test layout
# would force files to live at `tests/tests/*.rs` (because the crate IS named
# `tests`). To honour the roadmap-specified file path
# `tests/acceptance/release_process/validate_tag.rs`, we use explicit `[[test]]`
# blocks. Each acceptance scenario gets its own block; one block per file.

[package]
name = "modeltap-acceptance"
version = "0.0.0"
edition = "2021"
publish = false
license.workspace = true
description = "Black-box acceptance tests for the modeltap release pipeline (xtask)."
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
# `tempfile` is a *runtime* dep of the lib half (src/lib.rs) because the
# shared fixture helpers (e.g., `seed_tap_remote_with_initial_commit`) own
# the working-clone tempdir. It's also listed under [dev-dependencies] so the
# integration tests that link against this crate's lib still see the same
# crate version (cargo unifies them via the workspace dep).
tempfile = { workspace = true }
# tool-model-info-sqlite-cache step 01-03: the in-process TestTool plugin
# (src/test_tool.rs) implements modeltap-core::Tool, so the lib half needs
# the trait crate, async-trait for the trait's async methods, and tokio for
# the unit tests (#[tokio::test]) over it.
modeltap-core = { path = "../crates/modeltap-core" }
async-trait = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# tool-model-info-sqlite-cache step 01-05: the CACHE seam helper
# (src/fixtures/cache_fixtures.rs) opens cache.sqlite via a read-only
# `rusqlite::Connection` to verify `PRAGMA user_version` and row counts.
# Per acceptance-test-plan.md §1 CM-A: this is a test-utility, not a
# production import; rusqlite never reaches a release binary because the
# `modeltap-acceptance` crate is `publish = false` and lives outside the
# composition root.
rusqlite = { workspace = true }
# Step 01-05: the cache-introspection helper's unit tests seed the cache
# via `modeltap_store::Cache::open` so the round-trip from real write to
# read-only verifier mirrors what process A and the CACHE seam do at
# scenario time. Test-only — never imported by the walking-skeleton driver
# itself (which talks only to the modeltap binary + the CACHE seam).
modeltap-store = { path = "../crates/modeltap-store" }
# tool-model-info-sqlite-cache step 04-02: recursive directory snapshot for
# the cache-opt-out acceptance suite. `walkdir = "2"` already lives in the
# workspace (modeltap-app and the inspect plugins pull it in), so this is a
# resolver-unified entry, not a new crate.
walkdir = "2"

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
# tool-model-info-sqlite-cache step 01-05: the WS step-definitions parse
# launch.log JSONL events (`launch.warm_paint_ms` from process B) to assert
# the K-INFO-1 warm-paint latency budget.
serde_json = { workspace = true }
# YAML parsing for the workflow_structure acceptance test (DELIVER step 01-07,
# US-08 / ADR-010): reads .github/workflows/release.yml and asserts the
# architectural invariants of the multi-job DAG (validate-tag → build →
# publish-github-release) plus the C3 CI-parity gate ordering.
serde_yaml = "0.9"
# Property-based test for the atomic-publish guard (DELIVER step 02-02,
# US-08 / ADR-010): generates the 2^4 = 16 outcome combinations across the
# 4 build matrix cells and asserts the GH-Actions `needs:` semantics —
# publish runs iff every cell succeeds, bump runs iff publish ran.
proptest = "1"
# Markdown parsing for the runbook acceptance test (DELIVER step 03-03,
# US-13): parses RELEASING.md as a CommonMark event stream so the structural
# assertions (≤80 lines, ≤10 numbered list items, table-column presence,
# required section headers) survive cosmetic re-flow without false alarms.
pulldown-cmark = { version = "0.13", default-features = false }
# tool-model-info-sqlite-cache step 04-03: per-tool TTL acceptance scenarios
# drive `warm_start::run` and `cache_path::resolve` directly (Strategy A,
# no subprocess). modeltap-app is the composition-root crate; tests link
# it via a path-dep so the integration test exercises the production
# orchestrator without spawning a child binary.
modeltap-app = { path = "../crates/modeltap-app" }
# tool-model-info-sqlite-cache step 05-04: pre-mutate drift / gone acceptance
# scenarios need to bump an on-disk file's mtime AFTER the cache row has been
# seeded so the next `verify_against_fs` observes the (mtime, size, inode, dev)
# quad disagreeing with the cache. `filetime` is the maintained, tiny crate
# that exposes platform-portable `utime`-style atime / mtime mutation
# (Unix `utimensat`, macOS `utimes`, Linux `utimensat`). Test-only dependency
# — never reaches a production binary.
filetime = "0.2"
# tool-model-info-sqlite-cache step 06-02: regression_gate.rs imports the
# `modeltap_tui::screens::help_overlay::render_help_lines` pure function so
# the INT-INFO-9 vocabulary check runs against the SAME data path the TUI
# renderer uses — a refactor that swaps the data source cannot let the
# regression test silently drift. Path-dep keeps this in lockstep with the
# rest of the workspace.
modeltap-tui = { path = "../crates/modeltap-tui" }

# One acceptance scenario per [[test]] block. Each block points at the file
# under `acceptance/<area>/<scenario>.rs`. The test name is the harness name
# Cargo prints in test output.

# Lean UI-lifecycle acceptance suite (load / navigate+shortcuts / close).
# These three replace the per-feature cache + detail acceptance binaries;
# detailed feature logic is covered by crate-level integration/unit tests.
# US-27 AC-27-1 (SHA256 persistence) is folded into ui_navigate_shortcuts.
[[test]]
name = "ui_loads"
path = "acceptance/ui_loads.rs"

[[test]]
name = "ui_navigate_shortcuts"
path = "acceptance/ui_navigate_shortcuts.rs"

[[test]]
name = "ui_closes"
path = "acceptance/ui_closes.rs"

# tool-model-info-sqlite-cache step 04-02 — Cache opt-out paths (US-23
# Scenario 6 + AC-23-8 / AC-23-9 + INT-INFO-6). Four scenarios proving the
# `--no-cache` CLI flag, the `[cache] enabled = false` config file setting,
# and the `--version` short-circuit all reach the "zero cache bytes written"
# invariant via a DirManifest snapshot before/after each launch.
[[test]]
name = "cache_opt_out"
path = "acceptance/cache_opt_out.rs"

# tool-model-info-sqlite-cache step 04-03 — Per-tool TTL eligibility (US-25
# AC-25-2 / AC-25-4), production cache-path resolution (AC-23-1 / OQ-1), and
# transient I/O fallback (AC-25-7). Three scenarios driven in-process against
# the `warm_start::run` orchestrator and `cache_path::resolve` adapter using
# the `devon-cache-stale-tool` fixture (one tool 25h old, two tools 2h/1h
# fresh). Strategy A — no subprocess.
[[test]]
name = "cache_ttl"
path = "acceptance/cache_ttl.rs"

# tool-model-info-sqlite-cache step 01-05 — Walking Skeleton M1 (US-23 / US-25).
# PHASE 01 WALKING-SKELETON EXIT GATE: Devon's second launch shows yesterday's
# inventory instantly from cache. Drives two `modeltap` binary invocations
# back-to-back against a real on-disk cache.sqlite under MODELTAP_CACHE_PATH;
# process A writes (cold-start reconcile), process B paints from cache (warm-
# start orchestration) and emits launch.warm_paint_ms <= 150 ms.
[[test]]
name = "cache_walking_skeleton"
path = "acceptance/cache_walking_skeleton.rs"

# tool-model-info-sqlite-cache step 04-05 — Phase 04 EXIT GATE: K-INFO budget
# verification (US-23 K-INFO-1, K-INFO-7; INT-INFO-1; K3a / K3b parents).
# Three @perf scenarios that drive the warm-start orchestrator + the launch-
# metrics facade against the devon-cache-warm / devon-cache-empty fixtures
# and assert the four launch.* duration events land within budget. Each
# scenario early-returns on `cfg!(debug_assertions)` because the 150 ms /
# 100 ms K-INFO numbers are calibrated against release builds; CI runs the
# scenarios via `cargo test --release --test cache_kpi`.
[[test]]
name = "cache_kpi"
path = "acceptance/cache_kpi.rs"

# tool-model-info-sqlite-cache step 04-04 — Concurrent-process cache safety
# (US-23 Scenarios 4-5 / AC-23-10). Two scenarios proving the WAL +
# busy_timeout PRAGMAs set at Cache::open (step 01-02) work end-to-end
# against concurrent `modeltap` processes:
#   1. Two modeltap processes can read the cache concurrently via SQLite WAL
#      — process A seeds one row, then B and C launch in parallel and both
#      paint cleanly with no SQLITE_BUSY surfaced.
#   2. Concurrent cache writes serialise via busy_timeout — process A holds
#      the write lock for 2 s via the `MODELTAP_DEBUG_HOLD_WRITE_LOCK_MS=2000`
#      cfg-gated test seam (modeltap-store/src/repo/tools.rs); process B
#      launches 100 ms later and busy-waits at `BEGIN IMMEDIATE` until A
#      commits. Both exit 0, B emits a `cache.write_wait_ms` JSONL event,
#      and `cache_tools.last_scan_at` advances to B's later write.
[[test]]
name = "cache_concurrent"
path = "acceptance/cache_concurrent.rs"

# tool-model-info-sqlite-cache step 02-01 — US-21 tool-detail screen (closes
# the Msg::OpenToolDetail dispatch wiring). Four scenarios covering AC-21-1
# (Enter -> detail screen within 100 ms via the tool_detail.open_ms JSONL
# event), AC-21-3 (undetectable version renders as "(not detectable)"),
# AC-21-4 (last_error surfaces from the cache with timestamp), AC-21-7 (Esc
# returns to Main preserving the left-pane cursor). AC-21-5 ("User-configured
# search paths are labelled") is deferred to step 02-02 — it requires a
# plugin override of inspect_tool that no production plugin ships in 02-01.
[[test]]
name = "tool_detail"
path = "acceptance/tool_detail.rs"

# tool-model-info-sqlite-cache step 02-03 part 3/3 — INT-INFO-8 panic-
# isolation orchestrator boundary (US-21 AC-21-9 + US-22 AC-22-7). Drives the
# TestTool's `inspect_tool` panic seam (`MODELTAP_TEST_TOOL_INSPECT_PANIC=1`,
# landed in part 1 / commit 12f9559) through the real modeltap binary against
# the catch_unwind boundary (landed in part 2 / commit bd2a975). Asserts the
# rendered frame surfaces "(inspection failed -- see diagnostics.log)",
# `<MODELTAP_DIAGNOSTICS_DIR>/diagnostics.log` gains an
# `inspect_panic tool=test-tool` line, and the process exits cleanly.
[[test]]
name = "integration_checkpoints"
path = "acceptance/integration_checkpoints.rs"

# tool-model-info-sqlite-cache step 03-01 part 3/3 — US-22 model-detail
# screen cucumber driver (CLOSES step 03-01). Part 1 (commit 4b4197c) landed
# the open_model_detail orchestrator scaffolding (METADATA_UNSUPPORTED_SENTINEL,
# Msg::OpenDetail / ModelDetailReady / ReintrospectModel variants, RunMode
# enum). Part 2 (commit 03b6143) wired those Msg variants into both the
# interactive and headless event loops via dispatch_open_model_detail. This
# block exposes the end-to-end driver for the 5 model-detail.feature
# scenarios. ONE active scenario (AC-22-7 partial-info-graceful via the
# Unsupported render path through MODELTAP_HEADLESS_DETAIL_REGS routed at the
# Ollama plugin's trait-default inspect_model); FOUR scenarios stay
# `#[ignore]` pending step 03-02 plugin overrides (GGUF header metadata, Ollama
# manifest fields, HF config.json fields, re-introspect cache writeback).
[[test]]
name = "model_detail"
path = "acceptance/model_detail.rs"

# tool-model-info-sqlite-cache step 05-03 — US-24 manual refresh hotkeys + US-25
# summary-bar provenance. Four scenarios mirroring manual-refresh.feature:
# `[r]` refresh selected tool in ≤1 s, `[Shift+R]` refresh all in ≤2 s, `[r]`
# no-op under a dialog, and the always-visible provenance suffix transitions.
# All four currently `#[ignore]`d pending the launch.log timing seam — the
# behavioural coverage runs in `modeltap-tui` unit tests:
#  - `view::provenance::tests` for the pure format_provenance function
#    (CM-D §9 of acceptance-test-plan.md), every threshold + None case.
#  - `keymap::tests` for the SHORTCUT_TABLE [r] / [Shift+R] entries and
#    their ContextFilter::NoDialog gate.
#  - `render::summary_bar::tests` for the "reconciling..." / "refreshing
#    <tool>..." / "as of just now (<tool> refreshed)" suffix transitions.
[[test]]
name = "manual_refresh"
path = "acceptance/manual_refresh.rs"

# tool-model-info-sqlite-cache step 05-04 — Pre-mutate revalidation drift &
# gone end-to-end (US-26 AC-26-5 / AC-26-6 / AC-26-7). Two scenarios from
# cache-state-model.feature lines 211-237:
#   1. Drift — when verify_against_fs reports Drift before a destructive
#      action, the orchestrator MUST re-introspect the drifted file via the
#      plugin's inspect_model, write the recomputed size/metadata back to
#      cache_models, and emit `inspect.invoked source=pre_mutate_drift` to
#      launch.log. The pre/post UnifyOutcome reflects CacheStale so the
#      caller short-circuits without filesystem mutation.
#   2. Gone — when verify_against_fs reports Gone, the orchestrator MUST
#      enqueue a per-tool refresh for the affected tool, emit
#      `refresh.tool source=pre_mutate_gone` to launch.log, surface
#      "file no longer exists; refreshing inventory" through the action
#      outcome, and leave the fixture filesystem byte-identical (DirManifest
#      equality pre/post).
# Strategy A — in-process drives of `actions::unify::run` + the new
# `orchestration::revalidate::re_introspect_after_drift` /
# `auto_refresh_after_gone` orchestrator helpers. The full visible TUI dialog
# UX ("Re-introspecting before proceeding..." progress indicator, dialog
# re-confirm flow, right-pane "file no longer exists" line) is gated on the
# launch.log timing seam from manual_refresh.rs and lands via the TUI's
# dialog renderer in a follow-up step — see acceptance/cache_revalidate.rs
# file-level note.
[[test]]
name = "cache_revalidate"
path = "acceptance/cache_revalidate.rs"

# tool-model-info-sqlite-cache step 06-01 — OQ-3 release-build absence
# checks. Two #[ignore]-marked tests that build the modeltap binary with
# `cargo build --release --no-default-features -p modeltap-app --bin
# modeltap` and `strings`-grep it for the two test-only env-var literals
# (`MODELTAP_TEST_PLUGINS`, `MODELTAP_DEBUG_HOLD_WRITE_LOCK_MS`). Both must
# yield zero matches, proving the `#[cfg(any(test, feature = "test-harness"))]`
# gates strip the seams when the upstream features are disabled. Marked
# `#[ignore]` because `cargo build --release` is slow (~60-180 s clean);
# CI's release-prep job runs them via `cargo test --test release_build_check
# -- --ignored`.
[[test]]
name = "release_build_check"
path = "acceptance/release_build_check.rs"

# tool-model-info-sqlite-cache step 06-02 — Phase 06 finalize regression gate.
# Four regression invariants on static artefacts (no subprocess, no async):
#   1. Parent modeltap-tui master-acceptance.feature non-@skip scenario
#      count >= 90 (pinned baseline; a drop means a parent scenario was
#      removed or accidentally @skip-tagged).
#   2. Sibling folder-group-bulk-delete.feature carries >= 1 scenario tagged
#      with each of @milestone-1..=@milestone-6 (M1..M6 coverage invariant).
#   3. tool-model-info-sqlite-cache/sha256-persistence.feature still carries
#      exactly 3 scenarios, each tagged BOTH @release-3 AND @skip (US-27
#      deferral pin per ADR-018).
#   4. INT-INFO-9 vocabulary sample — modeltap_tui::screens::help_overlay::
#      render_help_lines output contains the 5 named UX surfaces verbatim
#      ("refresh tool", "refresh all", "recovery banner", "tool detail",
#      "model detail").
# Test crate already depends on modeltap-tui transitively via modeltap-app;
# but the help-overlay test needs a direct path-dep, added in [dev-dependencies].
[[test]]
name = "regression_gate"
path = "acceptance/regression_gate.rs"

[[test]]
name = "release_process_validate_tag"
path = "acceptance/release_process/validate_tag.rs"

# DELIVER step 01-03 — Walking Skeleton PUBLISH activity (US-05).
[[test]]
name = "release_process_extract_changelog"
path = "acceptance/release_process/extract_changelog.rs"

# DELIVER step 01-04 — Walking Skeleton TAP-BUMP activity (US-06, render-formula).
[[test]]
name = "release_process_render_formula"
path = "acceptance/release_process/render_formula.rs"

# DELIVER step 01-05 — Walking Skeleton lint pure function + lint-workflows CLI
# wiring (US-14). Three scenarios: valid workflow (exit 0), over-budget (exit
# non-zero with line-count message), job missing `# Purpose:` comment (exit
# non-zero identifying the offending job).
[[test]]
name = "release_process_lint_workflows"
path = "acceptance/release_process/lint_workflows.rs"

# DELIVER step 01-06 — Walking Skeleton PREP activity (US-01, release-prep).
# Four scenarios: happy path (Cargo.toml + CHANGELOG.md mutated, exit 0),
