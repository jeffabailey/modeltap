# Acceptance-test crate for the release-process feature.
#
# Wave: DELIVER (6 of 6) — added in step 01-02 (validate-tag).
#
# This crate hosts black-box acceptance tests that drive the `xtask` binary
# via `cargo run --package xtask -- ...` against fixture Cargo.toml files
# in tempdirs. It is excluded from default-members so plain `cargo test`
# from a workspace crate does not transitively run these tests, but
# `cargo test --workspace` DOES include them (per acceptance-test convention
# specified in the roadmap).
#
# Layout note: the conventional `<crate>/tests/*.rs` integration-test layout
# would force files to live at `tests/tests/*.rs` (because the crate IS named
# `tests`). To honour the roadmap-specified file path
# `tests/acceptance/release_process/validate_tag.rs`, we use explicit `[[test]]`
# blocks. Each acceptance scenario gets its own block; one block per file.

[package]
name = "modeltap-acceptance"
version = "0.0.0"
edition = "2021"
publish = false
license.workspace = true
description = "Black-box acceptance tests for the modeltap release pipeline (xtask)."
autotests = false

[lib]
path = "src/lib.rs"

[dependencies]
# `tempfile` is a *runtime* dep of the lib half (src/lib.rs) because the
# shared fixture helpers (e.g., `seed_tap_remote_with_initial_commit`) own
# the working-clone tempdir. It's also listed under [dev-dependencies] so the
# integration tests that link against this crate's lib still see the same
# crate version (cargo unifies them via the workspace dep).
tempfile = { workspace = true }
# tool-model-info-sqlite-cache step 01-03: the in-process TestTool plugin
# (src/test_tool.rs) implements modeltap-core::Tool, so the lib half needs
# the trait crate, async-trait for the trait's async methods, and tokio for
# the unit tests (#[tokio::test]) over it.
modeltap-core = { path = "../crates/modeltap-core" }
async-trait = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# tool-model-info-sqlite-cache step 01-05: the CACHE seam helper
# (src/fixtures/cache_fixtures.rs) opens cache.sqlite via a read-only
# `rusqlite::Connection` to verify `PRAGMA user_version` and row counts.
# Per acceptance-test-plan.md §1 CM-A: this is a test-utility, not a
# production import; rusqlite never reaches a release binary because the
# `modeltap-acceptance` crate is `publish = false` and lives outside the
# composition root.
rusqlite = { workspace = true }
# Step 01-05: the cache-introspection helper's unit tests seed the cache
# via `modeltap_store::Cache::open` so the round-trip from real write to
# read-only verifier mirrors what process A and the CACHE seam do at
# scenario time. Test-only — never imported by the walking-skeleton driver
# itself (which talks only to the modeltap binary + the CACHE seam).
modeltap-store = { path = "../crates/modeltap-store" }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
# tool-model-info-sqlite-cache step 01-05: the WS step-definitions parse
# launch.log JSONL events (`launch.warm_paint_ms` from process B) to assert
# the K-INFO-1 warm-paint latency budget.
serde_json = { workspace = true }
# YAML parsing for the workflow_structure acceptance test (DELIVER step 01-07,
# US-08 / ADR-010): reads .github/workflows/release.yml and asserts the
# architectural invariants of the multi-job DAG (validate-tag → build →
# publish-github-release) plus the C3 CI-parity gate ordering.
serde_yaml = "0.9"
# Property-based test for the atomic-publish guard (DELIVER step 02-02,
# US-08 / ADR-010): generates the 2^4 = 16 outcome combinations across the
# 4 build matrix cells and asserts the GH-Actions `needs:` semantics —
# publish runs iff every cell succeeds, bump runs iff publish ran.
proptest = "1"
# Markdown parsing for the runbook acceptance test (DELIVER step 03-03,
# US-13): parses RELEASING.md as a CommonMark event stream so the structural
# assertions (≤80 lines, ≤10 numbered list items, table-column presence,
# required section headers) survive cosmetic re-flow without false alarms.
pulldown-cmark = { version = "0.13", default-features = false }

# One acceptance scenario per [[test]] block. Each block points at the file
# under `acceptance/<area>/<scenario>.rs`. The test name is the harness name
# Cargo prints in test output.

# tool-model-info-sqlite-cache step 01-05 — Walking Skeleton M1 (US-23 / US-25).
# PHASE 01 WALKING-SKELETON EXIT GATE: Devon's second launch shows yesterday's
# inventory instantly from cache. Drives two `modeltap` binary invocations
# back-to-back against a real on-disk cache.sqlite under MODELTAP_CACHE_PATH;
# process A writes (cold-start reconcile), process B paints from cache (warm-
# start orchestration) and emits launch.warm_paint_ms <= 150 ms.
[[test]]
name = "cache_walking_skeleton"
path = "acceptance/cache_walking_skeleton.rs"

[[test]]
name = "release_process_validate_tag"
path = "acceptance/release_process/validate_tag.rs"

# DELIVER step 01-03 — Walking Skeleton PUBLISH activity (US-05).
[[test]]
name = "release_process_extract_changelog"
path = "acceptance/release_process/extract_changelog.rs"

# DELIVER step 01-04 — Walking Skeleton TAP-BUMP activity (US-06, render-formula).
[[test]]
name = "release_process_render_formula"
path = "acceptance/release_process/render_formula.rs"

# DELIVER step 01-05 — Walking Skeleton lint pure function + lint-workflows CLI
# wiring (US-14). Three scenarios: valid workflow (exit 0), over-budget (exit
# non-zero with line-count message), job missing `# Purpose:` comment (exit
# non-zero identifying the offending job).
[[test]]
name = "release_process_lint_workflows"
path = "acceptance/release_process/lint_workflows.rs"

# DELIVER step 01-06 — Walking Skeleton PREP activity (US-01, release-prep).
# Four scenarios: happy path (Cargo.toml + CHANGELOG.md mutated, exit 0),
# dirty tree refusal, non-monotonic bump refusal, gate-failure exits non-zero
# naming the failed gate.
[[test]]
name = "release_process_release_prep"
path = "acceptance/release_process/release_prep.rs"

# DELIVER step 01-07 — Walking Skeleton workflow-structure assertion
# (US-08 atomic publish, US-14 line budget, ADR-010 single-workflow DAG).
# Parses .github/workflows/release.yml and asserts the architectural
# invariants: tag trigger pattern, jobs.needs DAG, CI parity gate ordering
# (fmt → clippy → test → build --release), per-job `# Purpose:` comments,
# and that the file passes `xtask lint-workflows`.
[[test]]
name = "release_process_workflow_structure"
path = "acceptance/release_process/workflow_structure.rs"

# DELIVER step 01-08 — Walking Skeleton TAP-BUMP activity (US-06,
# bump-tap-formula). Five scenarios covering the cross-repo seam against an
# ephemeral file:// tap-fake bare repo per DWD-02: happy push, idempotent
# re-run with force-with-lease, unreachable-remote failure, formula content
# fidelity round-trip, missing --formula input.
[[test]]
name = "release_process_bump_tap_formula"
path = "acceptance/release_process/bump_tap_formula.rs"

# DELIVER step 01-08 — Walking Skeleton EXIT GATE end-to-end smoke. Wires
# validate-tag → extract-changelog → render-formula → bump-tap-formula
# against ephemeral modeltap-fake (working) + tap-fake (bare) repos and
# asserts the rendered formula round-trips through the full pipeline into
# the tap repo's bump branch with version + sha256 preserved verbatim. Also
# asserts the production release.yml declares the bump-tap-formula job
# with `needs: publish-github-release` (atomic-publish extension to US-06).
[[test]]
name = "release_process_walking_skeleton_e2e"
path = "acceptance/release_process/walking_skeleton_e2e.rs"

# DELIVER step 02-01 — Multi-arch build matrix structural assertions
# (US-07, ADR-012). Five invariants: matrix declares exactly the 4 supported
# targets; per-target runner mapping (macos-14 / macos-13 / ubuntu-22.04 x2);
# fail-fast: false; aarch64-unknown-linux-gnu cell installs cross v0.2.5
# (--locked) and uses `cross build`; upload-artifact names artifacts
# `release-${{ matrix.target }}` with archive + sha256 sidecar.
[[test]]
name = "release_process_build_matrix"
path = "acceptance/release_process/build_matrix.rs"

# DELIVER step 02-02 — Atomic-publish guard (US-08, ADR-010). Two layers:
# (1) Structural assertions on `.github/workflows/release.yml` — publish-github-release
#     declares `needs: [validate-tag, build]`, bump-tap-formula declares
#     `needs: publish-github-release`, and NO job uses `if: always()` or
#     `if: failure()` to bypass the guard.
# (2) Proptest of GH-Actions `needs:` semantics across 2^4 = 16 outcome
#     combinations of pass/fail for the 4 build matrix cells: publish runs
#     iff every cell succeeded; bump runs iff publish ran.
[[test]]
name = "release_process_atomic_publish"
path = "acceptance/release_process/atomic_publish.rs"

# DELIVER step 02-05 — Multi-arch end-to-end smoke + cross-artifact version
# consistency proof (closes Phase 02). Two test files:
#
# * multi_arch_e2e.rs — INT.AC-5 happy + failure paths against ephemeral
#   modeltap-fake (working) + tap-fake (bare) repos. Lifts the WS exit gate
#   (01-08) to all 4 build matrix cells. Happy: 4 sidecars staged → render
#   produces 4-platform formula → bump-tap-formula opens bump branch with
#   all 4 sha256s round-tripped. Failure: 3 of 4 sidecars staged → render
#   refuses (per the missing-sidecar gate added in 02-04) → no bump branch
#   exists in the tap repo (proves zero visible effects).
#
# * version_consistency.rs — INT.AC-1 (example covering all 6 axes including
#   the real `modeltap-app --version` binary; property covering 5 axes via
#   proptest with 8 cases of generated semvers) + INT.AC-2 (formula sha256 ≡
#   sidecar bare-hex content) + INT.AC-3 (formula url = release-base-url +
#   archive-name). INT.AC-2 + INT.AC-3 are folded into the same render to
#   avoid re-creating identical fixtures three times.
[[test]]
name = "release_process_multi_arch_e2e"
path = "acceptance/release_process/multi_arch_e2e.rs"

[[test]]
name = "release_process_version_consistency"
path = "acceptance/release_process/version_consistency.rs"

# DELIVER step 03-01 — Auto-merge wiring for the tap-bump PR (US-11).
# Three structural assertions on `.github/workflows/release.yml`:
#   A-1 + A-2. bump-tap-formula job invokes `gh pr merge --auto --squash`
#              against jeffabailey/homebrew-modeltap targeting the bump branch
#              for the current version.
#   A-3. The auto-merge step runs AFTER the bump-and-open-PR step (GitHub
#        rejects --auto on a PR that does not yet exist).
#   A-4. @requires_external smoke (#[ignore]d): live tap-repo round-trip,
#        gated on MODELTAP_LIVE_SMOKE=1.
[[test]]
name = "release_process_auto_merge"
path = "acceptance/release_process/auto_merge.rs"

# DELIVER step 03-02 — Idempotent retry for bump-tap-formula via
# force-push-with-lease + gated PR creation (US-12). Four scenarios against
# an ephemeral file:// tap-fake bare repo with a stubbed `gh` binary on PATH:
#   1. First-run-creates: `gh pr create` invoked exactly once when no PR exists.
#   2. Re-run-force-pushes: a second invocation force-pushes the latest
#      formula AND does NOT open a second PR.
#   3. N-retries property: for N ∈ 1..=5 retries, exactly one PR + one bump
#      branch exist; the LAST run's formula content wins.
#   4. Manual-edits-clobbered: a maintainer's manual edit on `bump/v<version>`
#      is overwritten on the next bump-tap-formula invocation.
[[test]]
name = "release_process_idempotent_retry"
path = "acceptance/release_process/idempotent_retry.rs"

# DELIVER step 03-03 — RELEASING.md runbook structural assertions (US-13).
# Three scenarios from hands-off-automation.feature, US-13:
#   1. Runbook exists at repo root within the line budget (≤80 lines, ≤10
#      numbered steps).
#   2. Runbook contains the per-release log table (8 specified columns).
#   3. Runbook documents the operational safety notes (GH_TAP_TOKEN rotation,
#      manual-edit-clobber trade-off, macOS Gatekeeper xattr workaround) AND
#      the First-time-setup section (create tap repo, set GH_TAP_TOKEN,
#      configure tap branch protection — bundled per component-boundaries §7).
# Parses RELEASING.md as a CommonMark event stream via pulldown-cmark so
# cosmetic re-flow does not break structural invariants.
[[test]]
name = "release_process_runbook"
path = "acceptance/release_process/runbook.rs"

# DELIVER step 03-04 — Follow-up workflows (DEVOPS handoff items #1 + #3,
# integration-checkpoints.feature `@follow-up-workflow` scenarios). Asserts
# the structural shape of the two NEW workflow files:
#   * .github/workflows/release-pipeline-alert.yml — opens a labelled issue
#     when release.yml concludes with conclusion != 'success'.
#   * .github/workflows/token-expiry-warning.yml — weekly probe of the tap
#     repo via `gh api` with GH_TAP_TOKEN; opens an issue on 401.
# Five Gherkin scenarios map 1:1 to test functions: trigger shape +
# permissions + per-job filter + label/body assertions + xtask lint-workflows.
[[test]]
name = "release_process_follow_up_workflows"
path = "acceptance/release_process/follow_up_workflows.rs"

# DELIVER step 03-05 — CI parity (INT.AC-6) + ci.yml lint-workflows wiring.
# Two scenarios covering the cross-workflow flag-parity invariant (release.yml
# uses byte-for-byte the same fmt/clippy/test commands as ci.yml — silent flag
# drift would let releases ship lints that PR builds reject) plus the step's
# own acceptance criterion that ci.yml runs `xtask lint-workflows` against
# release.yml and the two follow-up workflows so workflow drift (line-budget
# overshoot, missing `# Purpose:` comment) is caught at PR time.
[[test]]
name = "release_process_ci_parity"
path = "acceptance/release_process/ci_parity.rs"

# DELIVER step 03-05 — Recovery scenarios (`@recovery` tag in
# integration-checkpoints.feature). Two scenarios against ephemeral
# modeltap-fake (working) + tap-fake (bare) repos:
#   R-1. GH Release stays intact when bump-tap-formula fails (modelled as an
#        unreachable tap remote URL); the maintainer's retry reaches the same
#        end state with no duplicate bump branch (US-12 idempotency).
#   R-2. Maintainer yanks v0.2.0 by reverting the tap-bump merge commit; tap
#        main resolves to v0.1.0's Formula so `brew install` installs the
#        prior version. The prior release's artifact snapshot remains intact.
[[test]]
name = "release_process_recovery"
path = "acceptance/release_process/recovery.rs"

# DELIVER step 02-03 — SLSA L3 build-provenance attestation (US-09, ADR-013).
# Five invariants on `.github/workflows/release.yml`:
#   S-1. build job declares job-level `permissions:` with `id-token: write`,
#        `attestations: write`, and `contents: read` (least privilege).
#   S-2. build job invokes `actions/attest-build-provenance` pinned to `@v2`
#        (major-version tag — single-maintainer OSS trade-off per US-09).
#   S-3. attest step `with.subject-path` references the per-cell archive
#        `modeltap-*.tar.gz` so each matrix cell attests its own archive.
#   S-4. Step ordering: package step  <  attest step  <  upload-artifact step.
#   S-5. @requires_external smoke (#[ignore]d): `gh attestation verify` succeeds
#        against a published archive and identifies the modeltap workflow as
#        builder (K-PROV KPI hook).
[[test]]
name = "release_process_slsa_attestation"
path = "acceptance/release_process/slsa_attestation.rs"
