# cargo-deny configuration for modeltap.
# Per docs/feature/modeltap-tui/devops/release-strategy.md §5 + ci-pipeline.md §8.
#
# License policy: only OSS-permissive (and weak-copyleft MPL-2.0) licenses are
# allowed. GPL/AGPL family is denied implicitly by being absent from `allow`.

[advisories]
yanked = "deny"
ignore = [
    # paste 1.0.15 is unmaintained (author archived dtolnay/paste).
    # Pulled in transitively by ratatui v0.28.1 only — modeltap does not
    # depend on paste directly. Unmaintained != vulnerable; ratatui is
    # tracking the migration upstream. Re-evaluate when ratatui ships a
    # release that drops paste (likely v0.30 or v1.0).
    { id = "RUSTSEC-2024-0436", reason = "transitive via ratatui; unmaintained, not vulnerable" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
