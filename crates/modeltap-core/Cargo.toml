[package]
name = "modeltap-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-domain core for modeltap-tui (no I/O). Per ADR-001 + ADR-007."

[lints.rust]
unsafe_code = "forbid"

[features]
# Public parametrized contract-test harness for plugin crates. Off by default
# so production builds (binary, library consumers) do not link `walkdir` or
# any other test-only machinery. Plugin crates opt-in from their
# `[dev-dependencies]`. See `src/tests/plugin_contract.rs` +
# `src/tests/inspect.rs`. `tokio` is pulled in only when the harness is
# enabled because the §3.12.S.3 panic-isolation helper requires `tokio::spawn`.
test-helpers = ["dep:walkdir", "dep:tokio"]

[dependencies]
# ADR-007: thiserror in domain.
thiserror = { workspace = true }
serde = { workspace = true }

# Optional dep — only pulled in when the `test-helpers` feature is enabled.
# Used by the plugin contract-test harness to manifest the fixture directory
# pre/post `Tool::delete_folder` for the §3.11.U.1 immutability assertion.
walkdir = { version = "2", optional = true }

# Optional dep — only pulled in when the `test-helpers` feature is enabled.
# Used by `tests::inspect::run_inspect_with_panic_isolation` to spawn the
# `inspect_tool()` future inside a tokio task so a panic surfaces as
# `JoinError::is_panic()` (per US-21 step 02-03 / INT-INFO-8). Production
# builds without `test-helpers` re-use the dev-dep declared in
# `[dev-dependencies]` below — Cargo unifies the two declarations.
tokio = { workspace = true, optional = true }

# ADR-001: object-safe async trait for `Tool`. This is a domain port; the
# adapters (plugins) live outside the hexagon.
async-trait = "0.1"

# `inventory::collect!` slot for `PluginFactory`. Plugins (the adapters)
# register via `inventory::submit!` against this same slot. The slot lives
# here so plugin crates do not depend on each other (US-18 architecture-lint).
inventory = "0.3"

# Architecture rule R1: no plugin crate may appear here. Mechanically enforced
# in step 01-02 by the architecture rule test (see devops/ci-pipeline.md §4).

[dev-dependencies]
# Property-based testing for the compatibility-indicator engine invariant
# (US-09 @property scenario). Used by tests/compatibility_property.rs.
proptest = "1"
# Async runtime for testing async trait methods (step 01-01: `Tool::delete_folder`
# default body). Dev-only — modeltap-core itself remains I/O-free.
tokio = { workspace = true }
# Tempdir for the GGUF header parser's `parse_header` on-disk test
# (`domain::gguf::tests::parse_header_from_file_reads_disk`).
tempfile = { workspace = true }
