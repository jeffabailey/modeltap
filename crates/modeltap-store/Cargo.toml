[package]
name = "modeltap-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite-backed inventory cache for modeltap (per ADR-015 / ADR-017). Sync I/O at the edge; pure transforms inside."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
# Pure-domain types (ToolId, ModelId, etc.). Architecture rule R8 allows
# this dependency; tokio / ratatui are forbidden.
modeltap-core = { path = "../modeltap-core" }

# SQLite bindings (per ADR-015). `bundled` ships a known SQLite version so
# behavior is independent of system SQLite.
rusqlite = { workspace = true }

# Forward-only embedded SQL migrations (per ADR-017).
rusqlite_migration = { workspace = true }

# Errors (per ADR-007).
thiserror = { workspace = true }

# JSON columns (search_paths, metadata_kv) and Serde-derived row types.
serde = { workspace = true }
serde_json = { workspace = true }

# Timestamp formatting / parsing (ISO-8601 UTC per data-models.md).
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# tool-model-info-sqlite-cache step 04-04 (US-23 Scenarios 4-5 / AC-23-10):
# enables the `MODELTAP_DEBUG_HOLD_WRITE_LOCK_MS=N` env-var seam inside
# `Cache::reconcile_tool`. The seam sleeps N ms BEFORE COMMIT so the
# concurrent-writers acceptance scenario can deterministically force a
# `BEGIN IMMEDIATE` busy_timeout wait on the second process. Release
# builds compiled without this feature NEVER read the env var (R3 / OQ-3
# invariant in acceptance-test-plan.md). `#[cfg(test)]` covers this crate's
# own integration tests; `feature = "test-harness"` is the lever the
# modeltap-acceptance crate flips on the modeltap binary it spawns.
test-harness = []
