[package]
name = "modeltap-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Composition root and main() for modeltap. Wires plugins, runtime, TUI, and observability."

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "modeltap_app"
path = "src/lib.rs"

[features]
# Default-on so `cargo test --workspace` exercises the US-18 5th-plugin
# certification scenarios end-to-end. Release builds disable it via
# `cargo build --release --no-default-features` (see CI's release job + the
# CONTRIBUTING.md "Adding a plugin" walk-through).
#
# `test-harness` is default-on so `cargo test --workspace` (and the
# tool-model-info-sqlite-cache step 01-05 walking-skeleton acceptance test
# that spawns the modeltap binary via `assert_cmd::cargo_bin`) exercises
# the `MODELTAP_TEST_PLUGINS=test-tool` registry seam without per-crate
# feature flags. Release pipelines pass `--no-default-features` to strip
# both `test-fixtures` and `test-harness` so the env-var read and the
# `TestToolRegistration` body do not appear in the shipped binary; step
# 06-02 verifies via `strings target/release/modeltap`. See
# lat.md/test-plugin-seam.md.
default = ["test-fixtures", "test-harness"]
test-fixtures = [
    "dep:modeltap-plugin-atomic-chat-fixture",
    # Step 04-01: the M4 EBUSY acceptance test spawns the modeltap binary and
    # sets `MODELTAP_TEST_EBUSY_PATHS`. The seam that reads that env-var lives
    # in plugins/hf behind its own `test-harness` feature; enable it only when
    # this crate's `test-fixtures` feature is on so production binaries built
    # with `--no-default-features` never compile the seam (ADR-010 §D4).
    "modeltap-plugin-hf/test-harness",
]
# tool-model-info-sqlite-cache step 01-03: opt-in feature flag that compiles
# the in-process TestTool registration into the modeltap binary so the US-23
# cache acceptance suite can drive `MODELTAP_TEST_PLUGINS=test-tool`. Release
# builds (`cargo build --release --no-default-features`) leave this OFF so
# the env-var read and the TestToolRegistration body are absent from the
# shipped binary (step 06-02 verifies via `strings target/release/modeltap`).
# Pulls in the optional `async-trait` regular dep so the `#[async_trait]`
# macro on `TestToolRegistration` resolves when the lib is compiled outside
# `cfg(test)` (e.g. `cargo test --test plugin_registry_test_harness
# --features test-harness`).
test-harness = ["dep:async-trait"]

[[bin]]
name = "modeltap"
path = "src/main.rs"

[dependencies]
modeltap-core = { path = "../modeltap-core" }
modeltap-tui = { path = "../modeltap-tui" }
# tool-model-info-sqlite-cache step 01-04: the SQLite-backed inventory cache.
# Architecture invariant R7 — `modeltap-app` is the ONLY consumer of this
# crate. The cache is sync; the composition root bridges to async via
# `tokio::task::spawn_blocking` (architecture-design.md §7.1).
modeltap-store = { path = "../modeltap-store" }

# Plugin crates are linked into the binary at the composition root so their
# `inventory::submit!` blocks are pulled in. Per ADR-001, modeltap-app is the
# ONLY place that knows the concrete plugin set.
modeltap-plugin-ollama = { path = "../../plugins/ollama" }
modeltap-plugin-hf = { path = "../../plugins/hf" }
modeltap-plugin-lm-studio = { path = "../../plugins/lm-studio" }

# 5th REAL production plugin — Atomic Chat (Jan-fork). This is the live
# end-to-end proof of the US-18 plugin extensibility contract.
modeltap-plugin-atomic-chat = { path = "../../plugins/atomic-chat" }
modeltap-plugin-gpt4all = { path = "../../plugins/gpt4all" }

# US-18 5th-plugin certification fixture. Linked behind the `test-fixtures`
# Cargo feature so production binaries (built with `--release` and no
# `--features` flag, or `cargo build`) do NOT include it. Tests enable the
# feature via `default = ["test-fixtures"]` below.
modeltap-plugin-atomic-chat-fixture = { path = "../../plugins/atomic-chat-fixture", optional = true }

# Plugin discovery via `inventory::iter`.
inventory = "0.3"

# Async runtime (per ADR-005).
tokio = { workspace = true }

# Edge errors (per ADR-007).
anyhow = { workspace = true }
thiserror = { workspace = true }

# Observability (per devops/kpi-instrumentation.md).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }

# CLI parsing (per implementation_scope: clap for --headless arg).
clap = { workspace = true }

# Ratatui for the TestBackend used by headless mode and the production loop.
ratatui = { workspace = true }
crossterm = { workspace = true }

# SHA-256 streaming (per ADR-002, US-13).
sha2 = { workspace = true }

# Background SHA256 hash pool — cooperative cancellation primitive (ADR-013).
tokio-util = { version = "0.7", features = ["rt"] }

# Background SHA256 hash pool — worker count default = num_cpus.min(4) (ADR-013).
num_cpus = "1"

# Empty-directory cleanup after folder-delete (US-05c, AC-11). The plugin's
# `remove_empty_repo_tree` cannot clean directories the orchestrator just
# emptied via its HF-internal sidecar sweep, so the orchestrator owns a
# second cleanup pass.
walkdir = "2"

# Cross-platform standard paths (per technology-stack.md §3). Used by
# `adapters::cache_path::resolve` to compute the default cache location
# (`dirs::data_dir().join("modeltap/cache.sqlite")`).
dirs = "5"

# async_trait is needed when the `test-harness` feature compiles the
# `TestToolRegistration` impl in registry.rs into the library target (e.g.
# `cargo test --test plugin_registry_test_harness --features test-harness`,
# which builds the lib without `cfg(test)`). Kept optional + feature-gated
# so release binaries (`--no-default-features`) do not link it. Plain
# `cargo test --lib` paths (where the same `mod test_harness` block compiles
# via `cfg(test)`) continue to be satisfied by the dev-dependency below.
async-trait = { version = "0.1", optional = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
# Mock plugins in tests need async_trait to satisfy the `Tool` trait.
async-trait = "0.1"
