[package]
name = "modeltap-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Composition root and main() for modeltap. Wires plugins, runtime, TUI, and observability."

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "modeltap_app"
path = "src/lib.rs"

[features]
# Default-on so `cargo test --workspace` exercises the US-18 5th-plugin
# certification scenarios end-to-end. Release builds disable it via
# `cargo build --release --no-default-features` (see CI's release job + the
# CONTRIBUTING.md "Adding a plugin" walk-through).
default = ["test-fixtures"]
test-fixtures = ["dep:modeltap-plugin-atomic-chat-fixture"]

[[bin]]
name = "modeltap"
path = "src/main.rs"

[dependencies]
modeltap-core = { path = "../modeltap-core" }
modeltap-tui = { path = "../modeltap-tui" }

# Plugin crates are linked into the binary at the composition root so their
# `inventory::submit!` blocks are pulled in. Per ADR-001, modeltap-app is the
# ONLY place that knows the concrete plugin set.
modeltap-plugin-ollama = { path = "../../plugins/ollama" }
modeltap-plugin-llama-cli = { path = "../../plugins/llama-cli" }
modeltap-plugin-hf = { path = "../../plugins/hf" }
modeltap-plugin-lm-studio = { path = "../../plugins/lm-studio" }

# 5th REAL production plugin — Atomic Chat (Jan-fork). This is the live
# end-to-end proof of the US-18 plugin extensibility contract.
modeltap-plugin-atomic-chat = { path = "../../plugins/atomic-chat" }

# US-18 5th-plugin certification fixture. Linked behind the `test-fixtures`
# Cargo feature so production binaries (built with `--release` and no
# `--features` flag, or `cargo build`) do NOT include it. Tests enable the
# feature via `default = ["test-fixtures"]` below.
modeltap-plugin-atomic-chat-fixture = { path = "../../plugins/atomic-chat-fixture", optional = true }

# Plugin discovery via `inventory::iter`.
inventory = "0.3"

# Async runtime (per ADR-005).
tokio = { workspace = true }

# Edge errors (per ADR-007).
anyhow = { workspace = true }
thiserror = { workspace = true }

# Observability (per devops/kpi-instrumentation.md).
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
serde_json = { workspace = true }
ulid = { workspace = true }
time = { workspace = true }

# CLI parsing (per implementation_scope: clap for --headless arg).
clap = { workspace = true }

# Ratatui for the TestBackend used by headless mode and the production loop.
ratatui = { workspace = true }
crossterm = { workspace = true }

# SHA-256 streaming (per ADR-002, US-13).
sha2 = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
insta = { workspace = true }
walkdir = "2"
# Mock plugins in tests need async_trait to satisfy the `Tool` trait.
async-trait = "0.1"
