name: release

# Tag-triggered release pipeline (ADR-010 — single workflow, multi-job DAG).
# Step 02-01 expanded `build` to a 4-target matrix (US-07, ADR-012): native
# compiles for the 3 macOS/x86-linux cells; `cross` v0.2.5 (--locked) for the
# aarch64-unknown-linux-gnu cell on ubuntu-22.04. Step 02-03 added SLSA L3
# build provenance per archive via actions/attest-build-provenance@v2 (US-09).
#
# Architectural invariants enforced by tests/acceptance/release_process/
# workflow_structure.rs, walking_skeleton_e2e.rs, build_matrix.rs, and
# `cargo xtask lint-workflows`:
#   - on.push.tags includes 'v*.*.*'
#   - jobs.build needs validate-tag, declares 4-target matrix, fail-fast: false
#   - jobs.publish-github-release needs [validate-tag, build]
#   - jobs.bump-tap-formula needs publish-github-release (US-08 atomic publish)
#   - CI parity gates run BEFORE cargo build --release (C3 / US-03)
#   - every job has a `# Purpose:` comment immediately above its declaration
#   - file ≤ 300 lines (US-14, bumped from 250 in step 02-03 for SLSA wiring)

on:
  push:
    tags: ['v*.*.*']

# Tag pushes for the same tag must NEVER cancel each other (a re-pushed tag
# would otherwise abort an in-flight publish). We name the concurrency group
# by tag so concurrent runs of DIFFERENT tags coexist.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

# Workflow-level permissions stay minimal (least privilege): only the
# publish-github-release job needs `contents: write` to create the release.
# OIDC token minting + provenance write are scoped to the `build` job below
# (US-09 + ADR-013 — SLSA L3 build provenance per archive).
permissions:
  contents: write

jobs:
  # Purpose: Refuse a tag whose value does not match Cargo.toml workspace.package.version (C1 / US-02 single source of truth).
  validate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate tag matches Cargo.toml workspace.package.version
        run: cargo run --package xtask --quiet -- validate-tag --tag ${GITHUB_REF_NAME}

  # Purpose: Run CI parity gates (fmt, clippy, test) BEFORE producing release artifacts, then build, strip, and tar a 4-target matrix of binaries plus per-target sha256 sidecars (US-07, ADR-012).
  build:
    needs: validate-tag
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # One failing cell must NOT cancel the others — atomic-publish is enforced
      # at the publish job (US-08), not at build time.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-14
            use-cross: false
          - target: x86_64-apple-darwin
            runs-on: macos-13
            use-cross: false
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            use-cross: true
    # Job-scoped permissions for SLSA L3 build provenance (US-09 + ADR-013).
    # Least privilege: only this job mints OIDC tokens and writes attestations;
    # `contents: read` is for actions/checkout (publish job carries write).
    permissions:
      id-token: write
      attestations: write
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      # Per-target cache key prevents cross-target cache poisoning.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---- CI parity gates (C3 / US-03) -------------------------------------
      # Order is load-bearing: workflow_structure.rs asserts the indices.
      # Production builds NEVER run on unverified code. Gates run on the host
      # toolchain (not via cross), so they exercise the same code on every cell.
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      # -----------------------------------------------------------------------

      - name: Compute release version from tag
        id: version
        # Strip the leading `v` so VERSION matches Cargo.toml workspace.package.version.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Install `cross` ONLY on the aarch64-linux cell (ADR-012). Pinned at
      # 0.2.5 with --locked for reproducibility; no other cell pays this cost.
      - name: Install cross
        if: matrix.use-cross
        run: cargo install --locked --version 0.2.5 cross

      - name: cargo build --release
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --package modeltap-app --locked --target "${TARGET}"

      - name: cross build --release
        if: matrix.use-cross
        run: cross build --release --package modeltap-app --locked --target "${TARGET}"

      # macOS `strip` rejects unknown sections from rustc-emitted Mach-O without
      # `-x` (debug-info stripping only); GNU strip on linux runs without flags.
      - name: Strip binary (linux)
        if: runner.os == 'Linux'
        run: strip "target/${TARGET}/release/modeltap"
      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip -x "target/${TARGET}/release/modeltap"

      - name: Package archive and sha256 sidecar
        # Bare-hex sha256 (NOT GNU two-field format): just 64 hex chars + \n.
        # End-user verification: `sha256sum -c` is NOT used; the formula reads
        # the bare-hex content directly. macOS lacks `sha256sum` — fall back to
        # `shasum -a 256` on darwin runners.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          ARCHIVE="modeltap-${VERSION}-${TARGET}.tar.gz"
          tar -C "target/${TARGET}/release" -czf "${ARCHIVE}" modeltap
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" | cut -d' ' -f1 > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" | cut -d' ' -f1 > "${ARCHIVE}.sha256"
          fi
          ls -la "${ARCHIVE}" "${ARCHIVE}.sha256"

      # SLSA L3 build provenance (US-09 + ADR-013). Pinned to the major-version
      # tag `@v2` per US-09 accepted trade-off for a single-maintainer OSS
      # project. Each matrix cell attests its own per-target archive — the
      # glob resolves to ONE file per cell. End-users verify with
      # `gh attestation verify <archive> --owner jeffabailey` (K-PROV smoke).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: modeltap-*.tar.gz

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            modeltap-*.tar.gz
            modeltap-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  # Purpose: Publish a GitHub Release with the archive and sha256 sidecar; mark prerelease when the tag contains a hyphen (semver pre-release).
  publish-github-release:
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Compute release version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          cargo run --package xtask --quiet -- extract-changelog \
            --version "${{ steps.version.outputs.VERSION }}" \
            --input CHANGELOG.md \
            --output RELEASE_NOTES.md

      - name: Determine prerelease flag from tag
        id: prerelease
        # Hyphen in the tag (e.g. v0.0.1-rc1) marks a semver pre-release.
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "FLAG=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "FLAG=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            ${{ steps.prerelease.outputs.FLAG }} \
            artifacts/modeltap-*.tar.gz \
            artifacts/modeltap-*.tar.gz.sha256

  # Purpose: Render the Homebrew formula from the published archive sha256 sidecars and open a PR against the homebrew-modeltap tap repo (US-06 / WS exit gate).
  bump-tap-formula:
    needs: publish-github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modeltap (for the Tera template + xtask)
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download release artifacts (archives + sha256 sidecars)
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Compute release version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Render Formula/modeltap.rb from sha256 sidecars
        run: |
          set -euo pipefail
          mkdir -p Formula
          cargo run --package xtask --quiet -- render-formula \
            --version "${{ steps.version.outputs.VERSION }}" \
            --template release/templates/modeltap.rb.tera \
            --output Formula/modeltap.rb \
            --sha256-dir artifacts \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Bump tap formula and open PR
        env:
          # Cross-repo write needs a PAT with `repo` scope on the tap repo.
          # `secrets.GITHUB_TOKEN` cannot reach jeffabailey/homebrew-modeltap.
          GH_TOKEN: ${{ secrets.GH_TAP_TOKEN }}
        run: |
          set -euo pipefail
          cargo run --package xtask --quiet -- bump-tap-formula \
            --version "${{ steps.version.outputs.VERSION }}" \
            --tap-repo-url "https://x-access-token:${GH_TOKEN}@github.com/jeffabailey/homebrew-modeltap.git" \
            --formula Formula/modeltap.rb \
            --tap-repo-slug jeffabailey/homebrew-modeltap \
            --open-pr

      # Arm GitHub auto-merge on the freshly-opened tap PR (US-11). Squash
      # strategy keeps tap-repo main at one commit per release. The merge
      # fires only after `brew test-bot` reports green — that gate is the
      # tap-repo branch-protection rule (one-time setup, documented in
      # RELEASING.md by step 03-03). If the tap repo has not enabled
      # auto-merge at the repo level, `gh` exits with "Auto-merge is not
      # allowed for this repository" and this step fails LOUDLY (no silent
      # success) — the maintainer must enable auto-merge in repo settings.
      - name: Arm auto-merge on tap PR
        env:
          GH_TOKEN: ${{ secrets.GH_TAP_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge --auto --squash \
            --repo jeffabailey/homebrew-modeltap \
            "bump/v${{ steps.version.outputs.VERSION }}"
