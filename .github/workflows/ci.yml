name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --config cargo-deny.toml

  k3-bench:
    # Step 01-01 placeholder: the real K3 fixture lands in step 02-04 once the
    # `k3-bench` named fixture exists. For now this job verifies the headless
    # binary can paint and exit in under one second on a Linux runner — a
    # weak proxy that catches gross regressions in the launch path.
    name: K3 first-paint smoke (placeholder)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --package modeltap-app --locked
      - name: Smoke test K3 first paint
        run: |
          set -e
          start=$(date +%s%N)
          MODELTAP_HEADLESS=1 MODELTAP_TERM_COLS=100 \
            ./target/release/modeltap --quit-after-paint > /tmp/timing.json
          end=$(date +%s%N)
          elapsed_ms=$(( (end - start) / 1000000 ))
          echo "headless first-paint round-trip: ${elapsed_ms} ms"
          if [ "$elapsed_ms" -gt 1000 ]; then
            echo "::warning::first-paint round-trip ${elapsed_ms}ms > 1000 ms target (placeholder K3)"
          fi
          if [ "$elapsed_ms" -gt 2000 ]; then
            echo "::error::first-paint round-trip ${elapsed_ms}ms > 2000 ms guardrail"
            exit 1
          fi
      # TODO(02-04): replace with the real K3 fixture-driven benchmark per
      # docs/feature/modeltap-tui/distill/k3-benchmark-spec.md.

  ci-success:
    name: ci success
    needs: [fmt, clippy, test, deny, k3-bench]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All required checks passed."
